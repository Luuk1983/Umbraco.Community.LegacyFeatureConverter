name: CI

on:
  pull_request:
    branches: [main, 'support/**']
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Umbraco.Community.LegacyFeatureConverter.slnx

      - name: Build
        run: dotnet build Umbraco.Community.LegacyFeatureConverter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Umbraco.Community.LegacyFeatureConverter.slnx --configuration Release --no-build --verbosity normal

      - name: Pack (verify package builds)
        run: dotnet pack Umbraco.Community.LegacyFeatureConverter/Umbraco.Community.LegacyFeatureConverter.csproj --configuration Release --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 7
